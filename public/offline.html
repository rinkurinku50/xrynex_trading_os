<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0e13">
    <title>Offline · Xrynex Trading OS</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #0a0e13; color: #e4edf5; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 440px); border: 1px solid #263442; border-radius: 12px; background: #111820; padding: 28px; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 12px 0 20px; color: #a3b2c0; line-height: 1.6; }
      button { min-height: 44px; border: 1px solid #238c62; border-radius: 8px; background: #145c43; padding: 0 16px; color: white; font: inherit; font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Xrynex Trading OS needs a connection to securely load your workspace. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener('online', () => window.location.reload());
    </script>
  </body>
</html>
