<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative sample candlestick chart</title>
  <desc id="desc">Original educational illustration showing candles, a liquidity level, and a highlighted fair value gap. It is not real market data.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111820" />
      <stop offset="1" stop-color="#0a0e13" />
    </linearGradient>
    <pattern id="grid" width="100" height="80" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 80" fill="none" stroke="#24323f" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="700" fill="url(#background)" />
  <rect x="74" y="70" width="1050" height="530" rx="12" fill="url(#grid)" stroke="#334155" />
  <text x="100" y="112" fill="#d8e2ec" font-family="system-ui, sans-serif" font-size="24" font-weight="600">DEMO CHART · ILLUSTRATIVE ONLY</text>
  <text x="100" y="145" fill="#7b8b9c" font-family="system-ui, sans-serif" font-size="15">Not market data · Replace with your own chart</text>
  <line x1="100" y1="265" x2="1090" y2="265" stroke="#eab308" stroke-width="2" stroke-dasharray="9 8" />
  <text x="920" y="250" fill="#eab308" font-family="system-ui, sans-serif" font-size="15">Example liquidity level</text>
  <rect x="604" y="345" width="205" height="92" rx="6" fill="#3b82f6" fill-opacity=".16" stroke="#3b82f6" stroke-dasharray="6 5" />
  <text x="628" y="395" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="16">Illustrative FVG zone</text>
  <g stroke-width="4" stroke-linecap="round">
    <g stroke="#ef4444" fill="#ef4444"><line x1="170" y1="270" x2="170" y2="390"/><rect x="154" y="300" width="32" height="58" rx="3"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="245" y1="300" x2="245" y2="440"/><rect x="229" y="330" width="32" height="78" rx="3"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="320" y1="300" x2="320" y2="465"/><rect x="304" y="340" width="32" height="90" rx="3"/></g>
    <g stroke="#ef4444" fill="#ef4444"><line x1="395" y1="325" x2="395" y2="445"/><rect x="379" y="355" width="32" height="58" rx="3"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="470" y1="340" x2="470" y2="490"/><rect x="454" y="370" width="32" height="85" rx="3"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="545" y1="280" x2="545" y2="485"/><rect x="529" y="305" width="32" height="140" rx="3"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="620" y1="215" x2="620" y2="340"/><rect x="604" y="240" width="32" height="72" rx="3"/></g>
    <g stroke="#ef4444" fill="#ef4444"><line x1="695" y1="220" x2="695" y2="365"/><rect x="679" y="270" width="32" height="64" rx="3"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="770" y1="250" x2="770" y2="415"/><rect x="754" y="280" width="32" height="102" rx="3"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="845" y1="205" x2="845" y2="340"/><rect x="829" y="228" width="32" height="82" rx="3"/></g>
    <g stroke="#ef4444" fill="#ef4444"><line x1="920" y1="185" x2="920" y2="330"/><rect x="904" y="215" width="32" height="75" rx="3"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="995" y1="165" x2="995" y2="285"/><rect x="979" y="190" width="32" height="68" rx="3"/></g>
  </g>
  <text x="100" y="645" fill="#7b8b9c" font-family="system-ui, sans-serif" font-size="14">Sample visual for the Charts section</text>
  <text x="1090" y="645" fill="#7b8b9c" font-family="system-ui, sans-serif" font-size="14" text-anchor="end">DEMO</text>
</svg>
